<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 78" role="img" aria-labelledby="title desc">
  <title id="title">Panarwala &amp; Associates</title>
  <desc id="desc">Panarwala &amp; Associates — Premium Tax Consulting &amp; Preparation Services</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;family=Outfit:wght@600;700&amp;display=swap');
      .brand-title {
        font-family: 'Cormorant Garamond', 'Georgia', serif;
        font-weight: 700;
        font-size: 30px;
        fill: #0D2545;
        letter-spacing: 3.2px;
      }
      .brand-sub {
        font-family: 'Outfit', system-ui, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #0D2545;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        opacity: 0.95;
      }
      .orange-mark { fill: #E87B22; }
      .navy-mark { fill: #0D2545; }
      .gold-mark { fill: #C9A84C; }
    </style>
  </defs>
  <g transform="translate(6, 6)">
    <!-- Stylized Modern Emblem Icon -->
    <g transform="translate(0, 4)">
      <!-- Left decorative bars -->
      <rect class="orange-mark" x="0" y="10" width="18" height="4" rx="2"/>
      <rect class="orange-mark" x="0" y="18" width="22" height="4" rx="2"/>
      <rect class="orange-mark" x="0" y="26" width="16" height="4" rx="2"/>
      <rect class="orange-mark" x="0" y="34" width="22" height="4" rx="2"/>
      <rect class="orange-mark" x="0" y="42" width="18" height="4" rx="2"/>
      
      <!-- P Loop -->
      <path class="orange-mark" d="M26 6 C42 6, 54 14, 54 27 C54 40, 42 48, 26 48 L26 56 C26 57.5, 24.5 59, 23 59 L19 59 L19 6 C19 6, 26 6, 26 6 Z M26 38 C36 38, 44 33, 44 27 C44 21, 36 16, 26 16 L26 38 Z" />
      
      <!-- Gold Accent Bar -->
      <rect class="gold-mark" x="26" y="52" width="24" height="4" rx="2"/>
    </g>

    <!-- Wordmark Typography -->
    <text class="brand-title" x="72" y="35">PANARWALA</text>
    <text class="brand-sub" x="73" y="56">ASSOCIATES</text>
  </g>
</svg>
